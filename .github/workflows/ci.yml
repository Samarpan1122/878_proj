name: Safety engine
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: pip install -r requirements-test.txt -c requirements-safety.lock
      - run: pytest tests/test_safety*.py --cov=safety --cov-report=term-missing --cov-fail-under=80
      - run: bash -n infra/cloud-run.sh
